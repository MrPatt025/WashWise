# Dependabot configuration for automated dependency updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2
registries:
  npm-registry:
    type: npm-registry
    url: https://registry.npmjs.org
    replaces-base: true

updates:
  # ===========================================
  # GitHub Actions
  # ===========================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    reviewers:
      - "PATTANAKORN"
    open-pull-requests-limit: 5

  # ===========================================
  # Root npm packages (monorepo root)
  # ===========================================
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - npm-registry
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    reviewers:
      - "PATTANAKORN"
    open-pull-requests-limit: 10
    groups:
      typescript:
        patterns:
          - "typescript*"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "playwright*"
          - "@playwright/*"
        update-types:
          - "minor"
          - "patch"
      build-tools:
        patterns:
          - "turbo*"
          - "prettier*"
          - "husky*"
          - "lint-staged*"
        update-types:
          - "minor"
          - "patch"

  # ===========================================
  # Web Admin (Next.js app)
  # ===========================================
  - package-ecosystem: "npm"
    directory: "/apps/web-admin"
    registries:
      - npm-registry
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    commit-message:
      prefix: "deps(web-admin)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "web-admin"
    reviewers:
      - "PATTANAKORN"
    open-pull-requests-limit: 10
    groups:
      nextjs:
        patterns:
          - "next"
          - "next-*"
          - "@next/*"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-*"
          - "@types/react*"
        update-types:
          - "minor"
          - "patch"
      radix-ui:
        patterns:
          - "@radix-ui/*"
        update-types:
          - "minor"
          - "patch"
      tanstack:
        patterns:
          - "@tanstack/*"
        update-types:
          - "minor"
          - "patch"

  # ===========================================
  # API Server (Fastify)
  # ===========================================
  - package-ecosystem: "npm"
    directory: "/apps/api-server"
    registries:
      - npm-registry
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    commit-message:
      prefix: "deps(api-server)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "api-server"
    reviewers:
      - "PATTANAKORN"
    open-pull-requests-limit: 10
    groups:
      fastify:
        patterns:
          - "fastify"
          - "fastify-*"
          - "@fastify/*"
        update-types:
          - "minor"
          - "patch"

  # ===========================================
  # Database Package (Prisma)
  # ===========================================
  - package-ecosystem: "npm"
    directory: "/packages/database"
    registries:
      - npm-registry
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    commit-message:
      prefix: "deps(database)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "database"
    reviewers:
      - "PATTANAKORN"
    open-pull-requests-limit: 5
    groups:
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"
        update-types:
          - "minor"
          - "patch"

  # ===========================================
  # E2E Tests (Playwright)
  # ===========================================
  - package-ecosystem: "npm"
    directory: "/e2e"
    registries:
      - npm-registry
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    commit-message:
      prefix: "deps(e2e)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
      - "e2e"
    reviewers:
      - "PATTANAKORN"
    open-pull-requests-limit: 3

  # ===========================================
  # Docker images
  # ===========================================
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    commit-message:
      prefix: "deps(docker)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    reviewers:
      - "PATTANAKORN"
    open-pull-requests-limit: 5

  # ===========================================
  # Python (AI Worker)
  # ===========================================
  - package-ecosystem: "pip"
    directory: "/services/ai-worker"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "10:00"
      timezone: "Asia/Bangkok"
    commit-message:
      prefix: "deps(ai-worker)"
      include: "scope"
    labels:
      - "dependencies"
      - "python"
      - "ai-worker"
    reviewers:
      - "PATTANAKORN"
    open-pull-requests-limit: 5
    groups:
      fastapi:
        patterns:
          - "fastapi"
          - "uvicorn"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"

  # ===========================================
  # Java (Core API - Maven)
  # ===========================================
  - package-ecosystem: "maven"
    directory: "/services/core-api"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "11:00"
      timezone: "Asia/Bangkok"
    commit-message:
      prefix: "deps(core-api)"
      include: "scope"
    labels:
      - "dependencies"
      - "java"
      - "core-api"
    reviewers:
      - "PATTANAKORN"
    open-pull-requests-limit: 5
    groups:
      spring-boot:
        patterns:
          - "org.springframework.boot:*"
          - "org.springframework:*"
        update-types:
          - "minor"
          - "patch"
