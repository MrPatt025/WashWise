# CodeQL Security Analysis
# Performs semantic code analysis to find security vulnerabilities
# https://codeql.github.com/docs/

name: "CodeQL Security Analysis"

on:
  push:
    branches: [main, develop]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.java"
      - "**.py"
  pull_request:
    branches: [main, develop]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.jsx"
      - "**.java"
      - "**.py"
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: "0 0 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze-javascript:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
          config: |
            paths:
              - apps/
              - packages/
              - e2e/
            paths-ignore:
              - '**/node_modules/**'
              - '**/*.test.ts'
              - '**/*.spec.ts'
              - '**/dist/**'
              - '**/.next/**'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
          output: sarif-results
          upload: failure-only

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results
          wait-for-processing: true

  analyze-java:
    name: Analyze Java
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended,security-and-quality
          config: |
            paths:
              - services/core-api/
            paths-ignore:
              - '**/target/**'
              - '**/*Test.java'

      - name: Build Java project
        working-directory: services/core-api
        run: mvn clean compile -DskipTests -q

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
          output: sarif-results-java
          upload: failure-only

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results-java
          wait-for-processing: true

  analyze-python:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-extended,security-and-quality
          config: |
            paths:
              - services/ai-worker/
            paths-ignore:
              - '**/__pycache__/**'
              - '**/test_*.py'
              - '**/*_test.py'

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
          output: sarif-results-python
          upload: failure-only

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results-python
          wait-for-processing: true

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [analyze-javascript, analyze-java, analyze-python]
    if: always()

    steps:
      - name: Check analysis results
        run: |
          echo "## Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Language | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| JavaScript/TypeScript | ${{ needs.analyze-javascript.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | ${{ needs.analyze-java.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python | ${{ needs.analyze-python.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the Security tab." >> $GITHUB_STEP_SUMMARY
