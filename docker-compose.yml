# ============================================
# WashWise Development Docker Compose
# ============================================
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose logs -f        # View logs
#   docker-compose ps             # List services
# ============================================

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres:
    image: postgres:17-alpine
    container_name: washwise-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-washwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-washwise}
      POSTGRES_DB: ${POSTGRES_DB:-washwise}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-washwise} -d ${POSTGRES_DB:-washwise}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - washwise-network
    labels:
      - "com.washwise.service=database"
      - "com.washwise.description=PostgreSQL 17 Database"

  # ==========================================
  # Redis Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: washwise-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - washwise-network
    labels:
      - "com.washwise.service=cache"
      - "com.washwise.description=Redis 7 Cache"

  # ==========================================
  # Adminer (Database UI) - Development Only
  # ==========================================
  adminer:
    image: adminer:latest
    container_name: washwise-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: nette
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - washwise-network
    profiles:
      - tools
    labels:
      - "com.washwise.service=adminer"
      - "com.washwise.description=Database Admin UI"

  # ==========================================
  # Redis Commander (Redis UI) - Development Only
  # ==========================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: washwise-redis-commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - washwise-network
    profiles:
      - tools
    labels:
      - "com.washwise.service=redis-commander"
      - "com.washwise.description=Redis Admin UI"

  # ==========================================
  # MailHog (Email Testing) - Development Only
  # ==========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: washwise-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - washwise-network
    profiles:
      - tools
    labels:
      - "com.washwise.service=mailhog"
      - "com.washwise.description=Email Testing Server"

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres-data:
    name: washwise-postgres-data
  redis-data:
    name: washwise-redis-data

# ==========================================
# Networks
# ==========================================
networks:
  washwise-network:
    name: washwise-network
    driver: bridge
