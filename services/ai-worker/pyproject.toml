[project]
name = "washwise-ai-worker"
version = "1.0.0"
description = "AI Worker Service for WashWise Smart Laundromat Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.12",
    "uvicorn[standard]>=0.34.3",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.9.1",
    "redis>=5.3.0",
    "motor>=3.7.0",
    "httpx>=0.28.1",
    "openai>=1.87.0",
    "langchain>=0.3.25",
    "langchain-openai>=0.3.18",
    "langchain-community>=0.4.1",
    "langgraph>=0.4.10",
    "structlog>=25.4.0",
    "prometheus-client>=0.22.1",
    "opentelemetry-api>=1.34.1",
    "opentelemetry-sdk>=1.34.1",
    "opentelemetry-instrumentation-fastapi>=0.55b1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "httpx>=0.28.1",
    "ruff>=0.11.13",
    "mypy>=1.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
