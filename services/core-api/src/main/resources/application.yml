# ===========================================
# WashWise Core API - Application Configuration
# ===========================================

spring:
  application:
    name: washwise-core-api
  
  # Database Configuration
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/washwise}
    username: ${DATABASE_USERNAME:washwise}
    password: ${DATABASE_PASSWORD:washwise}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
        jdbc:
          time_zone: UTC

  # Flyway Migration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    schemas: public

  # Redis Configuration
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # Jackson Configuration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    time-zone: UTC

# ===========================================
# Server Configuration
# ===========================================
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
  error:
    include-message: always
    include-binding-errors: always

# ===========================================
# Security Configuration
# ===========================================
security:
  jwt:
    access-token:
      secret: ${JWT_ACCESS_SECRET:your-256-bit-secret-key-for-access-tokens-min-32-chars}
      expiration: 900000  # 15 minutes
    refresh-token:
      secret: ${JWT_REFRESH_SECRET:your-256-bit-secret-key-for-refresh-tokens-min-32-chars}
      expiration: 604800000  # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
    allowed-headers: "*"
    allow-credentials: true

# ===========================================
# Management & Observability
# ===========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: ${ENVIRONMENT:development}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.9, 0.95, 0.99
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_RATE:1.0}

# ===========================================
# OpenAPI Documentation
# ===========================================
springdoc:
  api-docs:
    path: /docs/openapi
  swagger-ui:
    path: /docs/swagger
    operations-sorter: method
    tags-sorter: alpha
  info:
    title: WashWise Core API
    version: 1.0.0
    description: Enterprise API for Smart Laundromat Management

# ===========================================
# Logging Configuration
# ===========================================
logging:
  level:
    root: INFO
    io.washwise: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId:-}] %-5level %logger{36} - %msg%n"

# ===========================================
# Application-Specific Configuration
# ===========================================
washwise:
  ai-worker:
    url: ${AI_WORKER_URL:http://localhost:8081}
    timeout: 30000
  
  rate-limit:
    enabled: true
    requests-per-minute: 100
    burst-capacity: 20

---
# ===========================================
# Test Profile
# ===========================================
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:tc:postgresql:16:///washwise_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: create-drop

  flyway:
    enabled: false

logging:
  level:
    root: WARN
    io.washwise: DEBUG

---
# ===========================================
# Production Profile
# ===========================================
spring:
  config:
    activate:
      on-profile: production

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    io.washwise: INFO
    org.hibernate.SQL: WARN

management:
  tracing:
    sampling:
      probability: 0.1
