# SonarQube/SonarCloud Configuration for WashWise
# https://docs.sonarqube.org/latest/analysis/analysis-parameters/

sonar.projectKey=washwise
sonar.projectName=WashWise
sonar.projectVersion=1.0.0

# Source encoding
sonar.sourceEncoding=UTF-8

# Language-specific source directories
sonar.sources=apps,packages,services
sonar.tests=apps,packages,services,e2e

# Test file patterns
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/tests/**/*,**/test/**/*,**/__tests__/**/*

# Exclusions from analysis
sonar.exclusions=\
  **/node_modules/**,\
  **/.next/**,\
  **/.turbo/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/coverage/**,\
  **/*.config.js,\
  **/*.config.mjs,\
  **/*.config.ts,\
  **/prisma/migrations/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/*.min.js,\
  **/*.min.css

# Coverage exclusions
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/tests/**/*,\
  **/test/**/*,\
  **/__tests__/**/*,\
  **/mocks/**/*,\
  **/*.d.ts,\
  **/types/**/*

# Duplicate code exclusions (UI components follow patterns)
sonar.cpd.exclusions=\
  **/components/ui/**/*,\
  **/migrations/**/*,\
  **/*.test.ts,\
  **/*.spec.ts

# =============================================================================
# TypeScript/JavaScript Settings
# =============================================================================

# TypeScript analysis
sonar.typescript.tsconfigPaths=apps/web-admin/tsconfig.json,apps/api-server/tsconfig.json,packages/*/tsconfig.json,e2e/tsconfig.json

# JavaScript/TypeScript file patterns
sonar.javascript.file.suffixes=.js,.mjs
sonar.typescript.file.suffixes=.ts,.tsx

# =============================================================================
# Java Settings (core-api)
# =============================================================================

sonar.java.source=21
sonar.java.target=21
sonar.java.binaries=services/core-api/target/classes
sonar.java.libraries=services/core-api/target/dependency/*.jar
sonar.java.test.binaries=services/core-api/target/test-classes

# =============================================================================
# Python Settings (ai-worker)
# =============================================================================

sonar.python.version=3.11,3.12
sonar.python.coverage.reportPaths=services/ai-worker/coverage.xml

# =============================================================================
# Rule Exclusions - UI Component Library (shadcn/ui patterns)
# These components follow established patterns and are auto-generated
# =============================================================================

# Disable memoization warnings for UI components (S6759)
# shadcn/ui components use forwardRef pattern which handles this differently
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11,e12,e13,e14,e15,e16,e17,e18,e19,e20

# S6759: Components don't need explicit memoization (UI library pattern)
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S6759
sonar.issue.ignore.multicriteria.e1.resourceKey=**/components/ui/**/*

# S6479: Array index as key is sometimes acceptable in static lists
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S6479
sonar.issue.ignore.multicriteria.e2.resourceKey=**/components/ui/**/*

# S6481: Inline objects in UI components (intentional for styling)
