# SonarCloud Configuration
# https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

sonar.projectKey=washwise_washwise
sonar.organization=washwise

# Project information
sonar.projectName=WashWise
sonar.projectVersion=1.0.0

# Source paths
sonar.sources=apps,packages,services
sonar.tests=apps/api-server/src/tests,e2e/tests,services/ai-worker/tests,services/core-api/src/test

# Source encoding
sonar.sourceEncoding=UTF-8

# ===========================================
# TypeScript / JavaScript configuration
# ===========================================
sonar.typescript.lcov.reportPaths=coverage/lcov.info,apps/*/coverage/lcov.info,packages/*/coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript config file
sonar.typescript.tsconfigPath=tsconfig.base.json

# ===========================================
# Python configuration (AI Worker)
# ===========================================
sonar.python.coverage.reportPaths=services/ai-worker/coverage.xml
sonar.python.version=3.12

# ===========================================
# Java configuration (Core API)
# ===========================================
sonar.java.binaries=services/core-api/target/classes
sonar.java.libraries=services/core-api/target/dependency/*.jar
sonar.java.source=21
sonar.coverage.jacoco.xmlReportPaths=services/core-api/target/site/jacoco/jacoco.xml

# ===========================================
# Exclusions
# ===========================================
sonar.exclusions=\
  **/node_modules/**,\
  **/.turbo/**,\
  **/.next/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/target/**,\
  **/__pycache__/**,\
  **/migrations/**,\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/test_*.py,\
  **/*_test.py,\
  **/*Test.java,\
  **/e2e/**,\
  **/*.config.{js,ts,mjs},\
  **/tailwind.config.js,\
  **/postcss.config.js,\
  **/next.config.mjs

# Test exclusions
sonar.test.exclusions=\
  **/node_modules/**,\
  **/.turbo/**,\
  **/.next/**,\
  **/dist/**,\
  **/coverage/**

# Coverage exclusions
sonar.coverage.exclusions=\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/test_*.py,\
  **/*_test.py,\
  **/*Test.java,\
  **/e2e/**,\
  **/*.config.{js,ts,mjs},\
  **/seed.ts,\
  **/migrations/**

# Duplication exclusions
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.spec.ts,\
  **/migrations/**

# ===========================================
# Quality Gates
# ===========================================
# These are enforced in SonarCloud dashboard
# - Coverage >= 80%
# - Duplications <= 3%
# - Maintainability Rating = A
# - Reliability Rating = A
# - Security Rating = A
